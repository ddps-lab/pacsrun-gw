# RELEASE — build the gateway's deployment package and publish it to Lambda.
#
# END-TO-END FLOW of one release:
#
#   1. A push to main, a v* tag, or a manual run starts this workflow, and the
#      `test` job runs the server suite. Nothing is published if it fails --
#      see the note on that job for the nine-hour outage that added it.
#   2. `permissions: id-token: write` lets the job ask GitHub for an OIDC token
#      whose `sub` claim names this repository.
#   3. configure-aws-credentials trades that token for temporary credentials by
#      calling sts:AssumeRoleWithWebIdentity against the IAM role
#      terraform/registry created. The role's trust policy checks `sub`, which is
#      what stops any other repository using it.
#   4. Dependencies are installed for Lambda's platform, not the runner's, and
#      zipped with the server package.
#   5. update-function-code publishes it.
#
# WHY A ZIP AND NOT AN IMAGE. Measured 2026-09-01: the dependencies come to
# 92.4 MB unzipped against Lambda's 250 MB limit. The ECR repository this
# workflow used to push to is still there for a possible return to running as a
# pod, and costs $0.40 a month.
#
# WHY --platform manylinux2014_x86_64 AND --only-binary. The runner is Ubuntu and
# Lambda is Amazon Linux; a wheel compiled for one can fail to load on the other,
# and it fails at import time inside the function rather than here. Forcing
# prebuilt wheels for Lambda's platform makes that impossible.
#
# REQUIRED repository configuration (Settings -> Secrets and variables -> Actions
# -> Variables), printed by `terraform output next_steps`:
#
#   AWS_REGION       us-west-2
#   AWS_ROLE_ARN     arn:aws:iam::<ACCOUNT_ID>:role/ddpsrun-gw-github-actions
#   LAMBDA_FUNCTION  ddpsrun-gw
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Required to mint the OIDC token. Nothing else is granted.
  id-token: write
  contents: read

jobs:
  # ★ THE GATE. This exists because on 2026-09-08 this workflow deployed a
  # commit whose `validate()` called a five-argument function with six
  # arguments, and POST /v1/validate answered 500 in production for nine hours
  # (10:37Z to 19:46Z). The `ci` workflow caught it -- 28 tests failed -- but
  # `ci` and `release` both trigger on the same push and run SIDE BY SIDE, so a
  # red `ci` never stopped the publish. A test suite that runs after the deploy
  # is a report, not a gate.
  #
  # It duplicates ci's `server-test` deliberately: `workflow_run` would let the
  # publish start on a stale commit, and `needs:` cannot reach across
  # workflows. Thirty seconds of install is the whole cost.
  #
  # WHY THE SERVER SUITE AND NOT THE CLI'S. This workflow publishes the server
  # and the screen. The CLI goes out through publish-pypi.yml on a tag, and its
  # tests gate nothing here.
  test:
    name: the server suite must pass before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The same version the function runs, so a failure here is a failure
          # there.
          python-version: "3.12"
      - name: install
        working-directory: server
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  publish:
    name: build the zip and publish it to Lambda
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match the function's runtime. A wheel built for a different
          # minor version can import here and fail there.
          python-version: "3.12"

      - name: assume the publish role over OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: build the deployment package
        working-directory: server
        run: |
          set -euo pipefail
          # Read the dependency list out of pyproject.toml rather than repeating
          # it here. It used to be repeated, and on 2026-09-01 that cost a 502:
          # pyjwt was added to pyproject for Cognito, this list was not touched,
          # and the deployed function died on `No module named 'jwt'`. One list
          # cannot drift from itself.
          #
          # Two things are dropped, and only two, each for its own reason:
          #   botocore  the Lambda runtime already provides it. Shipping ours
          #             would add tens of megabytes to a cold start that is
          #             already dominated by reading the package.
          #   uvicorn   only ever runs the server as a process. In Lambda,
          #             mangum is what speaks to the runtime, so uvicorn and its
          #             [standard] extras would be several megabytes never read.
          DEPS=$(python - <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          skip = ("botocore", "uvicorn")
          print(" ".join(
              d for d in project["dependencies"]
              if not d.lower().startswith(skip)
          ))
          PY
          )
          echo "packaging: $DEPS"
          python -m pip install --quiet --target build \
            --platform manylinux2014_x86_64 --python-version 3.12 \
            --only-binary=:all: $DEPS
          cp -r ddpsrun_server build/
          rm -rf build/boto3 build/botocore build/*.dist-info/RECORD
          cd build && zip -qr ../function.zip .
          cd .. && python - <<'PY'
          import os, zipfile
          size = os.path.getsize("function.zip")
          with zipfile.ZipFile("function.zip") as z:
              unzipped = sum(i.file_size for i in z.infolist())
          print(f"::notice::zip {size/1024/1024:.1f} MB, unzipped {unzipped/1024/1024:.1f} MB (limit 250 MB)")
          if unzipped > 250 * 1024 * 1024:
              raise SystemExit("the package is over Lambda's 250 MB unzipped limit")
          PY

      # ★ DO NOT PUBLISH AN ANCESTOR. A force push of a rewritten history pushes
      # many commits at once and GitHub starts a run for several of them; they
      # finish out of order, so the LAST one to call update-function-code wins.
      # MEASURED 2026-09-08: runs fired at 11:27 (9aef8b9, the new tip) and at
      # 11:31/11:32/11:33 for cdfd042/2f960d3/7538a49, which are its ANCESTORS.
      # The 11:33 run published 7538a49 and rolled production back past a
      # validate fix that had been verified live half an hour earlier -- with
      # every run green, because each one really did build the commit it was
      # given. A workflow that can deploy backwards has no useful green.
      #
      # The check is one API call: is this run's commit the current tip of the
      # default branch. `git rev-parse` on the checkout would not do -- the
      # checkout IS the stale commit, so it would compare it with itself.
      - name: refuse to publish anything but the current tip of main
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          echo "this run: ${{ github.sha }}"
          echo "main tip: $TIP"
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "::error::this commit is not the tip of main (probably an ancestor pushed by a force push). Refusing to publish it over a newer one. Re-run release on main: gh workflow run release.yml --ref main"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: publish
        working-directory: server
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION }}" \
            --zip-file fileb://function.zip \
            --query '{name:FunctionName,size:CodeSize,sha:CodeSha256}' --output json
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION }}"
          echo "::notice::published ${{ github.sha }} to ${{ vars.LAMBDA_FUNCTION }}"

  screen:
    name: upload the screen to S3
    runs-on: ubuntu-latest
    # Gated on the same suite. The screen's own check lives in ci's `screen`
    # job (does the page build the body the server accepts), and that one is
    # about the page; this dependency is about not shipping a page to a server
    # that is about to answer 500.
    needs: test
    # Skip rather than fail when the bucket has not been created yet. Without
    # this guard an unset UI_BUCKET expands to an empty string and the job dies
    # on `Invalid bucket name ""`, which reads as a broken pipeline rather than
    # as configuration that has not been done yet. Measured on run 33488695173.
    if: vars.UI_BUCKET != '' && vars.UI_DISTRIBUTION != '' && vars.API_BASE != ''
    steps:
      - uses: actions/checkout@v4

      - name: assume the publish role over OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same hazard as the publish job: an ancestor's `ui/` would be synced over
      # a newer one, with `--delete` removing files the newer page needs.
      - name: refuse to upload anything but the current tip of main
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "::error::this commit is not the tip of main. Refusing to sync its ui/ over a newer one."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: upload
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -euo pipefail
          # DDPSRUN-UI-CONFIG. The page and the API are on different hosts, so
          # the page cannot work the API address out from its own origin. It is
          # written here rather than committed because it is an environment
          # identifier, and this repository is meant to be opened later.
          #
          # Nothing in this file is a secret. It is one address, and it is the
          # address every request from this page goes to anyway.
          python - <<'PYEOF' > ui/config.json
          import json, os
          print(json.dumps({"api_base": os.environ["API_BASE"].rstrip("/")}, indent=2))
          PYEOF
          cat ui/config.json
          # DDPSRUN-UI-VERSIONED-ASSETS. index.html is uploaded with
          # cache-control no-cache, so a browser revalidates it every load and
          # always gets the newest one — but app.js and style.css keep the same
          # URL forever, and a copy cached BEFORE the no-cache header existed
          # is served from disk with no request at all. On 2026-09-08 that had a
          # reader pressing a Sign out button whose handler was in a newer file
          # they had never fetched. Stamping the commit into the query makes
          # each deploy a different URL, so the always-fresh index.html can
          # never point at a stale script.
          V="${GITHUB_SHA::12}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|" ui/index.html
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$V\"|" ui/index.html
          grep -E 'app\.js|style\.css' ui/index.html
          # --delete so a file removed from the repo disappears from the bucket
          # too; otherwise a deleted page keeps being served forever.
          #
          # --cache-control no-cache, because these files change under the SAME
          # names on every deploy. Without the header S3 sends none, browsers
          # cache heuristically, and a tab that loaded the page an hour ago
          # keeps running the OLD app.js after a deploy — on 2026-09-07 that
          # made a just-shipped fix look broken twice in one day. no-cache
          # means "revalidate every time": the browser asks with the ETag it
          # holds and CloudFront answers 304 from the edge, so the cost is one
          # conditional request per file per load, not a re-download.
          aws s3 sync ui/ "s3://${{ vars.UI_BUCKET }}/" --delete --cache-control no-cache
          # CloudFront caches aggressively and these files change on every
          # deploy, so the cache has to be told. Three files, so a blanket
          # invalidation is cheaper to reason about than a per-path one.
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.UI_DISTRIBUTION }}" \
            --paths '/*' --query 'Invalidation.Id' --output text


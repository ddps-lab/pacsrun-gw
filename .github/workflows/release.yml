# RELEASE — build the gateway's deployment package and publish it to Lambda.
#
# END-TO-END FLOW of one release:
#
#   1. A push to main, a v* tag, or a manual run starts this workflow.
#   2. `permissions: id-token: write` lets the job ask GitHub for an OIDC token
#      whose `sub` claim names this repository.
#   3. configure-aws-credentials trades that token for temporary credentials by
#      calling sts:AssumeRoleWithWebIdentity against the IAM role
#      terraform/registry created. The role's trust policy checks `sub`, which is
#      what stops any other repository using it.
#   4. Dependencies are installed for Lambda's platform, not the runner's, and
#      zipped with the server package.
#   5. update-function-code publishes it.
#
# WHY A ZIP AND NOT AN IMAGE. Measured 2026-09-01: the dependencies come to
# 92.4 MB unzipped against Lambda's 250 MB limit. The ECR repository this
# workflow used to push to is still there for a possible return to running as a
# pod, and costs $0.40 a month.
#
# WHY --platform manylinux2014_x86_64 AND --only-binary. The runner is Ubuntu and
# Lambda is Amazon Linux; a wheel compiled for one can fail to load on the other,
# and it fails at import time inside the function rather than here. Forcing
# prebuilt wheels for Lambda's platform makes that impossible.
#
# REQUIRED repository configuration (Settings -> Secrets and variables -> Actions
# -> Variables), printed by `terraform output next_steps`:
#
#   AWS_REGION       us-west-2
#   AWS_ROLE_ARN     arn:aws:iam::<ACCOUNT_ID>:role/ddpsrun-gw-github-actions
#   LAMBDA_FUNCTION  ddpsrun-gw
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Required to mint the OIDC token. Nothing else is granted.
  id-token: write
  contents: read

jobs:
  publish:
    name: build the zip and publish it to Lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match the function's runtime. A wheel built for a different
          # minor version can import here and fail there.
          python-version: "3.12"

      - name: assume the publish role over OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: build the deployment package
        working-directory: server
        run: |
          set -euo pipefail
          python -m pip install --quiet --target build \
            --platform manylinux2014_x86_64 --python-version 3.12 \
            --only-binary=:all: \
            fastapi mangum kubernetes pydantic
          cp -r ddpsrun_server build/
          # boto3 is provided by the Lambda runtime; shipping our own would add
          # tens of megabytes to a cold start that is already dominated by
          # reading the package.
          rm -rf build/boto3 build/botocore build/*.dist-info/RECORD
          cd build && zip -qr ../function.zip .
          cd .. && python - <<'PY'
          import os, zipfile
          size = os.path.getsize("function.zip")
          with zipfile.ZipFile("function.zip") as z:
              unzipped = sum(i.file_size for i in z.infolist())
          print(f"::notice::zip {size/1024/1024:.1f} MB, unzipped {unzipped/1024/1024:.1f} MB (limit 250 MB)")
          if unzipped > 250 * 1024 * 1024:
              raise SystemExit("the package is over Lambda's 250 MB unzipped limit")
          PY

      - name: publish
        working-directory: server
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION }}" \
            --zip-file fileb://function.zip \
            --query '{name:FunctionName,size:CodeSize,sha:CodeSha256}' --output json
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION }}"
          echo "::notice::published ${{ github.sha }} to ${{ vars.LAMBDA_FUNCTION }}"

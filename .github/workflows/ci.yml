# CI — 지금은 검사할 코드가 없다. 대신 이 저장소에서 가장 먼저 지켜야 할 것을 검사한다.
#
# 이 저장소는 나중에 public 으로 연다. 그때 손볼 것이 없도록 계정 식별자를 처음부터
# 자리표시자로 쓴다. 사람이 지키기로 하면 언젠가 새므로 여기서 막는다.
#
# 코드가 생겼으므로 server-test 와 server-image 를 아래에 더했다. no-identifiers 는 남긴다.
name: ci

on:
  push:
  pull_request:

jobs:
  no-identifiers:
    name: 계정 식별자가 섞이지 않았는지
    runs-on: ubuntu-latest
    steps:
      # ★ fetch-depth: 0 이 이 job 의 절반이다. 기본값은 1 커밋짜리 얕은 clone 이고, 그러면
      # 아래 검사가 "지금 트리" 만 본다. 비밀을 커밋했다가 다음 커밋에서 지우면 영원히
      # 통과하는데, 그게 public 저장소에서 자격증명이 새는 가장 흔한 경로다. 2026-09-04 에
      # 실증했다: 이 저장소의 옛 커밋에 개인 식별자가 든 파일이 있었고, 얕은 clone 에서
      # grep 은 0 건으로 통과했다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 검사
        run: |
          set -uo pipefail
          fail=0
          # AWS 계정번호 12자리. 자리표시자 <ACCOUNT_ID> 를 쓴다.
          check() {
            local name="$1" pat="$2"
            local hits
            # -e 가 필요하다. 개인키 패턴은 "-----BEGIN..." 으로 시작하므로 -e 없이
            # 넘기면 grep 이 그것을 옵션으로 읽고 usage 를 내며 죽는다. 뒤의
            # `|| true` 가 그 실패를 삼켜서, 이 검사는 무엇이 들어 있든 0 건으로
            # 통과했다. 2026-08-31 에 발견해 고쳤다.
            # -a 이지 -I 가 아니다. -I 는 binary 를 건너뛰고, 이 저장소는 binary 하나를
            # 추적한다(terraform/lambda/placeholder.zip). zip 안에 넣은 계정번호가 통과하는
            # 것을 2026-09-04 에 실증했다. -a 는 무엇이든 텍스트로 읽으므로 압축된 것은 여전히
            # 못 보지만, 압축되지 않은 binary 는 본다.
            hits=$(grep -ranE --exclude-dir=.git --exclude-dir=.venv \
                     --exclude-dir=node_modules -e "$pat" . | grep -v '^Binary file' || true)
            if [ -n "$hits" ]; then
              echo "::error::$name 이(가) 섞여 있습니다. 자리표시자로 바꾸십시오."
              echo "$hits"
              fail=1
            fi
          }
          # 이력 전체의 blob 을 훑는다. 위의 check 는 트리만 보고, 지워진 비밀은 트리에 없다.
          # `git grep <커밋>` 은 그 커밋의 트리를 검색하므로, 모든 커밋을 돌면 이력에 한 번이라도
          # 있었던 것을 전부 본다. 커밋이 수천 개가 되면 느려지므로 그때는 gitleaks 로 바꾼다.
          check_history() {
            local name="$1" pat="$2"
            local hits
            hits=$(git rev-list --all | while read -r c; do
                     git grep -InE -e "$pat" "$c" -- 2>/dev/null || true
                   done)
            if [ -n "$hits" ]; then
              echo "::error::$name 이(가) git 이력에 있습니다. 트리에서 지워도 남습니다."
              echo "$hits" | head -20
              fail=1
            fi
          }

          both() { check "$1" "$2"; check_history "$1" "$2"; }

          both "AWS 계정번호"      '\b[0-9]{12}\b'
          both "AWS access key id" 'AKIA[0-9A-Z]{16}'
          # ANCHOR 를 키 이름에서 떼어낸다. 옛 패턴은 소문자 ini 형태 `aws_secret_access_key=`
          # 만 잡았고, `export AWS_SECRET_ACCESS_KEY=`, YAML 의 `:` 형태,
          # `assume-role` 출력의 `"SecretAccessKey"` 는 전부 통과했다. grep 이 -i 없이 돌아
          # 대소문자도 갈렸다.
          both "AWS secret 형태"   '[Ss][Ee][Cc][Rr][Ee][Tt]_?[Aa][Cc][Cc][Ee][Ss][Ss]_?[Kk][Ee][Yy]["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9/+=]{40}'
          both "GitHub 토큰"       'gh[pousr]_[A-Za-z0-9]{36}'
          both "GitHub PAT"        'github_pat_[A-Za-z0-9_]{20,}'
          both "RunPod 키"         'rpa_[A-Za-z0-9]{40}'
          # 이 저장소가 실제로 가진 유일한 자격증명 종류다. terraform/cognito/terraform.tfvars 에
          # 실제 값이 있고 gitignore 로만 막혀 있으므로, 패턴이 없으면 `git add -f` 한 번에 나간다.
          both "Google OAuth secret" 'GOCSPX-[A-Za-z0-9_-]{10,}'
          both "개인키"            '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY'
          if [ "$fail" -ne 0 ]; then
            echo "자리표시자 예: <ACCOUNT_ID>, <RESULT_BUCKET>, role/<REMOTE_ROLE>, <IAM_USER>"
            exit 1
          fi
          echo "통과: 계정 식별자 없음"

  server-test:
    name: 서버 test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        working-directory: server
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  cli-test:
    name: CLI test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # requires-python 은 >=3.9 다. 사용자 노트북의 파이썬을 우리가 고를 수
          # 없으므로 가장 낮은 것으로 돌린다. 서버는 우리 이미지라 3.12 로 돈다.
          python-version: "3.9"
      - name: 설치
        working-directory: cli
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: cli
        run: python -m pytest -q
      - name: 명령이 실제로 설치되는지
        run: ddpsrun --help

  references-current:
    name: agent reference 가 코드와 맞는지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        # generator 가 서버의 OpenAPI 와 CLI 의 parser 를 둘 다 읽는다.
        run: |
          pip install -e server
          pip install -e cli
      - name: 대조
        # 라우트나 flag 가 바뀌었는데 reference 를 다시 안 만들었으면 여기서 막힌다.
        # agent 가 읽는 문법 문서가 코드와 어긋나는 것을 사람의 기억에 맡기지 않는다.
        run: python3 agent/scripts/generate_references.py --check

  server-image:
    name: 서버 image 가 빌드되는지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 빌드만 하고 push 하지 않는다. registry 를 아직 안 정했다
      # (docs/08-plan.md 미결 항목 13). 여기서 빌드해 두는 이유는 Dockerfile 이
      # 깨진 것을 배포하는 날에 처음 알게 되지 않도록 하려는 것이다.
      # 이미지는 로컬 docker daemon 으로 절대 굽지 않는다 — CI 가 유일한 빌더다.
      - name: docker build
        working-directory: server
        run: docker build -t ddpsrun-gw:${{ github.sha }} .

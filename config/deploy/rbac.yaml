# What the gateway server is allowed to do in the cluster.
#
# THE SHAPE, AND WHY. One ClusterRole holding the verbs, then ONE RoleBinding
# PER TENANT NAMESPACE. A ClusterRoleBinding would have been one object instead
# of N, and it would also let the server read pods in kube-system. Binding per
# namespace means adding a tenant is a deliberate act with a reviewable diff.
#
# WHAT IS DELIBERATELY ABSENT FROM THE ClusterRole: `secrets`. The submit path
# writes a `secretKeyRef` into the PacsJob and lets kubelet resolve it, so it
# never holds a GitHub token or an API key.
#
# ★ AND `secrets` MUST STAY OUT OF THE ClusterRole EVEN NOW THAT ONE ROUTE
# WRITES THEM. The live cluster binds this ClusterRole with a
# ClusterRoleBinding, not the per-namespace RoleBindings this file describes
# (checked 2026-09-08: `kubectl get clusterrolebinding ddpsrun-gw` exists and
# names Group `ddpsrun-gw`). So a `secrets` verb added up there would be a
# secrets verb in kube-system. The write path gets its own Role at the bottom
# of this file, bound one namespace at a time -- see DDPSRUN-USER-SECRET.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ddpsrun-gw
  namespace: ddpsrun-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ddpsrun-gw
rules:
  # Submit, read back, and cancel the jobs it created.
  #
  # `delete` is what DDPSRUN-CANCEL needs. Deleting the PacsJob is the only stop
  # the CRD offers, and PACSrun's controller watches for it to give back whatever
  # the job rented. Without this verb the cancel route reaches the apiserver and
  # comes back 403 — which is how it shipped on 2026-09-02: the route, the CLI
  # command and the button were all correct, and the cluster refused them.
  #
  # No `update` or `patch`. A submitted job is not edited; it is cancelled and
  # submitted again. Being able to rewrite somebody's spec after the fact is not
  # something this server needs.
  - apiGroups: ["pacsrun.io"]
    resources: ["pacsjobs"]
    verbs: ["create", "get", "list", "delete"]
  # Find the pod behind a job, so `/v1/jobs/{id}/logs` knows whose stdout to read.
  # `list` and not `get`: the server looks a pod up by label, never by name.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # DDPSRUN-EXEC. `POST /v1/jobs/{id}/exec` runs one command in a job's driver
  # pod (which relays it into the workload container on the rented machine).
  # Both verbs on purpose: the exec subresource maps a WebSocket upgrade to
  # `get` and the SPDY path to `create`, and which one a client library uses is
  # its implementation detail — the kubernetes Python client's stream() takes
  # the WebSocket road today and could change under an upgrade.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # DDPSRUN-PROMETHEUS-PROXY. Reach the in-cluster Prometheus through the apiserver instead of
  # giving it an address of its own.
  #
  # WHY A VERB AND NOT AN INGRESS. Prometheus holds one lab's GPU history and the obvious way to
  # query it is a public endpoint — an ALB at $16.43/month, a certificate, and a second place to
  # get authentication wrong. This server already proves who it is to the apiserver in order to
  # read a pod's log; `services/proxy` lets it borrow that for a Service. The Service stays
  # ClusterIP and nothing new is exposed.
  #
  # `get` ALONE. The proxy subresource maps HTTP verbs onto RBAC verbs, so `get` permits GET and
  # nothing else — this server reads Prometheus and must never be able to POST to its
  # remote-write path, which is how a bug here could corrupt the series it exists to protect.
  #
  # THE BINDING IS STILL PER TENANT NAMESPACE (below), and Prometheus is in pacsrun-system, so
  # this verb needs its own RoleBinding there — see the second binding at the end of this file.
  # Listing the verb without that binding grants nothing, which is the failure mode to expect if
  # /v1/metrics/query answers 502 with a 403 underneath.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
---
# One of these per tenant namespace. `<TENANT_NAMESPACE>` is the namespace a
# token maps to in the token file (see `docs/09-server.md`).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ddpsrun-gw
  namespace: <TENANT_NAMESPACE>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ddpsrun-gw
subjects:
  - kind: ServiceAccount
    name: ddpsrun-gw
    namespace: ddpsrun-system
---
# The binding that makes the services/proxy verb above reach anything. Prometheus lives in
# pacsrun-system, which is NOT a tenant namespace, so the per-tenant bindings never covered it.
#
# A SECOND ROLE, NARROWED TO ONE VERB, rather than binding the whole ClusterRole here. Binding the
# full role would also let this server create and delete PacsJobs in pacsrun-system and read the
# operator's own pods — neither of which it has any reason to do, and both of which would then be
# one bug away from happening.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ddpsrun-gw-prometheus
  namespace: pacsrun-system
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ddpsrun-gw-prometheus
  namespace: pacsrun-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ddpsrun-gw-prometheus
subjects:
  # A GROUP, NOT A ServiceAccount, and the first draft got this wrong. The gateway server does not
  # run in this cluster — it is a Lambda. It proves who it is with an EKS access entry, which maps
  # the IAM role `ddpsrun-gw-lambda` to username
  # `arn:aws:sts::<ACCOUNT_ID>:assumed-role/ddpsrun-gw-lambda/{{SessionName}}` and to the
  # kubernetesGroup `ddpsrun-gw`. RBAC sees the GROUP; the ServiceAccount of the same name is what
  # a pod running in the cluster would use, and there is no such pod.
  #
  # Binding a ServiceAccount instead grants nothing and says nothing: `kubectl apply` succeeds,
  # the binding exists, and every request is still refused. `aws eks describe-access-entry
  # --principal-arn <the lambda role>` is what settles which subject is real.
  - kind: Group
    name: ddpsrun-gw
    apiGroup: rbac.authorization.k8s.io
---
# DDPSRUN-USER-SECRET. What `PUT /v1/secrets/{name}` needs, and not one verb more.
#
# WHY A SEPARATE Role AND NOT THREE MORE LINES IN THE ClusterRole ABOVE. The
# ClusterRole is bound cluster-wide in the live cluster, so a `secrets` verb in
# it would let this server write Secrets into kube-system. This Role is
# namespaced and bound one namespace at a time, which is what "a member of this
# namespace can register a value for jobs in this namespace" actually means.
# Apply one pair of these per tenant namespace, exactly like the RoleBinding
# above -- a namespace without them simply cannot register values, and
# `GET /v1/secrets` still answers there with the operator's own bindings.
#
# THE THREE VERBS, AND WHAT EACH ONE CANNOT DO.
#
#   create   Cannot be restricted by name: RBAC's `resourceNames` does not
#            apply to create, because at authorization time the object does not
#            exist yet. So this permits creating ANY Secret in this namespace --
#            and nothing else. It cannot overwrite `judge-bedrock` (create on an
#            existing name is 409 AlreadyExists) and it cannot read anything.
#            The server uses it exactly once: the first `secret set` in a
#            namespace, when `ddpsrun-user-secrets` does not exist yet.
#
#   get      Restricted to `ddpsrun-user-secrets` by name. `GET /v1/secrets`
#            needs the KEY names and the Kubernetes API has no keys-only read,
#            so this necessarily also permits reading those values. It does NOT
#            permit reading any other Secret in the namespace: an operator
#            binding's Secret stays unreadable by this process, which is the
#            promise the submit path has always made.
#
#   patch    Same one name. Adds or replaces one key (`stringData`), or removes
#            one (`data: {KEY: null}`). No `update`: a full replace would need
#            the whole object, and the server deliberately never assembles one.
#
# WHAT THIS DOES NOT PROTECT AGAINST, said plainly. A Kubernetes Secret is
# base64, not encryption. Anyone who already has `get secrets` in the namespace
# -- a cluster admin, or a pod with a ServiceAccount that grants it -- can read
# every registered value. That is the same exposure the operator's own bindings
# have always had, and it is why `docs/03-api.md` keeps values out of every
# response even though the write route puts one in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ddpsrun-gw-secrets
  namespace: <TENANT_NAMESPACE>
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ddpsrun-user-secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ddpsrun-gw-secrets
  namespace: <TENANT_NAMESPACE>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ddpsrun-gw-secrets
subjects:
  # A GROUP, for the reason spelled out at the prometheus binding above: the
  # gateway is a Lambda, it proves who it is with an EKS access entry, and RBAC
  # sees the kubernetesGroup that entry maps to. Binding a ServiceAccount here
  # applies cleanly and grants nothing.
  - kind: Group
    name: ddpsrun-gw
    apiGroup: rbac.authorization.k8s.io
